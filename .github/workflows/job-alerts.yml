name: Job alerts

on:
  schedule:
    # 07:00, 12:00 y 17:00 UTC (≈ 08/09, 13/14, 18/19 hora peninsular)
    - cron: "0 7,12,17 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar ofertas y notificar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main

      - name: Guardar ofertas vistas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_jobs.json
          git diff --cached --quiet || git commit -m "chore: actualizar ofertas vistas [skip ci]"
          git push
